name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: shellcheck install.sh upgrade.sh uninstall.sh scripts/*.sh
      - run: python scripts/validate_units.py
      - run: PYTHONPATH=src python -m androidctl --help
