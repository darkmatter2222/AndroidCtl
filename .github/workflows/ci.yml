name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: shellcheck install.sh upgrade.sh uninstall.sh scripts/*.sh
      - run: python scripts/validate_units.py
      - run: PYTHONPATH=src python -m androidctl --help
  opencode-plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test opencode/androidctl/test/core.test.mjs
      - run: node opencode/androidctl/cli.mjs help
