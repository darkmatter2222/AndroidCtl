name: OpenCode plugin release
on:
  push:
    branches: [main]
    paths:
      - opencode/androidctl/package.json
      - .github/workflows/opencode-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test opencode/androidctl/test/core.test.mjs opencode/androidctl/test/ui.test.mjs opencode/androidctl/test/install.test.mjs
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish versioned plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./opencode/androidctl/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="opencode-v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          archive="androidctl-opencode-$version.zip"
          git archive --format=zip --output="$archive" HEAD opencode docs/opencode.md "$notes" LICENSE
          # Recover a draft left by a transient GitHub publish/upload failure.
          if gh release view "$tag" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" == "false" ]]; then
              echo "Published release $tag already exists; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "OpenCode AndroidCtl v$version" --notes-file "$notes"
          fi
          gh release upload "$tag" "$archive" --clobber
          for attempt in 1 2 3; do
            if gh release edit "$tag" --draft=false; then
              exit 0
            fi
            sleep 3
          done
          exit 1
