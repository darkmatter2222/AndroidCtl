[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androidctl-host"
version = "0.1.0"
description = "Persistent native Android Emulator instances managed with KVM and systemd"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
androidctl = "androidctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
